<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3FDF8"/>
      <stop offset="1" stop-color="#E4F8F1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 210) rotate(60) scale(520)">
      <stop stop-color="#10B981" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 150) rotate(115) scale(420)">
      <stop stop-color="#0EA5E9" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: "Space Grotesk", "Inter", "Segoe UI", system-ui, sans-serif; }
      .title { font-size: 58px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-size: 26px; font-weight: 500; fill: #334155; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- inline favicon art, scaled up -->
  <g transform="translate(510 120) scale(7.5)">
    <rect x="2" y="2" width="20" height="20" rx="6" fill="#10b981"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" transform="translate(0.2 0) skewX(-9)">
      <path d="M8.2 7.2V16.8"/>
      <path d="M8.2 16.8H11.6"/>
      <path d="M12.9 7.2V16.8"/>
      <path d="M12.9 7.2h1.6c2.5 0 4.0 1.6 4.0 4.8s-1.5 4.8-4.0 4.8h-1.6"/>
    </g>
  </g>

  <text class="title" x="600" y="392" text-anchor="middle">LinkDrop</text>
  <text class="subtitle" x="600" y="442" text-anchor="middle">Send the current page to paired contacts in one click via context menu or popup.</text>
</svg>
